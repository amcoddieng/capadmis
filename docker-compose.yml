services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-capadmis}
      POSTGRES_USER: ${POSTGRES_USER:-capadmis}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD doit être défini dans .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL doit être défini dans .env}
    ports:
      - "${PORT:-3000}:3000"
    depends_on:
      db:
        condition: service_healthy

  front:
    build:
      context: ../capadmisfront
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL-}
        VITE_WS_URL: ${VITE_WS_URL-}
    restart: unless-stopped
    ports:
      - "${FRONT_PORT:-8080}:80"
    depends_on:
      - api

volumes:
  postgres_data:
